name: Publish approved site update
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Approved site_update_requests UUID
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: azm-site-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-updates
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved change and confirm publication
        env:
          SUPABASE_URL: ${{ secrets.AZM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AZM_SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/publish_approved_site_update.py
