<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azimuth Site Directory</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head>
<body><main id="workspace"><aside id="sidebar" aria-label="Site explorer"><header class="app-header"><div class="brand"><div class="brand-identity"><img class="brand-logo" src="azimuth-logo.png" alt="Azimuth Telecom Services"><small>Site Directory <span class="separator">·</span> Internal prototype</small></div></div><button id="collapseSidebar" class="icon-btn" type="button" aria-label="Collapse site explorer" title="Collapse sidebar">‹</button></header>
<div class="search"><label for="q" class="eyebrow">FIND A SITE</label><div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Site ID, name or address" autocomplete="off" aria-label="Search site"></div><fieldset class="province-filter"><legend>PROVINCES</legend><div id="provinceFilters" class="province-options"></div></fieldset><div id="status" role="status">Loading site records…</div><div id="results"></div></div>
<div id="detail" aria-live="polite"><div class="empty-state"><div class="empty-symbol" aria-hidden="true">⌖</div><h2>Select a site</h2><p>Search by Site ID, name or address to view site details and navigation.</p></div></div>
<div class="sidebar-footer">Authorized personnel only</div></aside><button id="expandSidebar" class="expand-tab" type="button" aria-label="Expand site explorer" title="Expand site explorer">›</button><div id="map" aria-label="Site location map"></div><div id="mapCount" class="map-count" aria-live="polite"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
